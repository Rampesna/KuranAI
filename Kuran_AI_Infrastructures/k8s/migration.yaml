apiVersion: batch/v1
kind: Job
metadata:
  name: gateway-migrate
  namespace: kuranai
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: kuranai-gateway-migrate
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: pgvector/pgvector:pg16
          command: ["sh", "-ec"]
          args: ["until pg_isready -h postgres -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\"; do sleep 2; done"]
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: kuranai-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: kuranai-secrets
                  key: POSTGRES_USER
      containers:
        - name: migrate
          image: kuranai-gateway:latest
          imagePullPolicy: Never
          command: ["/app/gateway", "migrate"]
          envFrom:
            - configMapRef:
                name: kuranai-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: kuranai-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kuranai-secrets
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: kuranai-secrets
                  key: POSTGRES_DB
            - name: RUN_MIGRATE
              value: "1"

