name: CI and production deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kuranai-production
  cancel-in-progress: false

jobs:
  backend:
    name: Test Go API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Kuran_AI_Gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: Kuran_AI_Gateway/go.mod
          cache-dependency-path: Kuran_AI_Gateway/go.sum
      - run: go test ./...
      - run: go vet ./...

  web:
    name: Lint and build React app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Kuran_AI_Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Kuran_AI_Web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_BASE: https://kuranai-api.talhacan.com
          VITE_GOOGLE_CLIENT_ID: 157832066999-3tgb2daavmrd1d1vd10ptrato1iu382t.apps.googleusercontent.com
          VITE_APPLE_CLIENT_ID: com.talhacan.kuranai.web
          VITE_APPLE_REDIRECT_URI: https://kuranai.talhacan.com/auth/apple/callback

  android:
    name: Test and lint Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Kuran_AI_Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest assembleDebug lintDebug --no-daemon

  deploy:
    name: Deploy Kubernetes production
    needs: [backend, web, android]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure production SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/kuranai-production
          chmod 600 ~/.ssh/kuranai-production
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Pull main and roll out Kubernetes workloads
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
        run: >-
          ssh -i ~/.ssh/kuranai-production
          -o BatchMode=yes
          -o StrictHostKeyChecking=yes
          "$PRODUCTION_USER@$PRODUCTION_HOST"
          'cd /www/wwwroot/kuranai && bash Kuran_AI_Infrastructures/scripts/deploy-from-git.sh'
      - name: Verify public endpoints
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 https://kuranai-api.talhacan.com/health >/dev/null
          curl --fail --silent --show-error --retry 12 --retry-delay 5 https://kuranai.talhacan.com/app >/dev/null
          curl --fail --silent --show-error --retry 12 --retry-delay 5 https://kuranai.talhacan.com/.well-known/apple-app-site-association >/dev/null
          [[ "$(curl --fail --silent --show-error --output /dev/null --write-out '%{content_type}' https://kuranai.talhacan.com/.well-known/apple-app-site-association)" == application/json* ]]
          curl --fail --silent --show-error --retry 12 --retry-delay 5 https://kuranai.talhacan.com/.well-known/assetlinks.json >/dev/null
          [[ "$(curl --fail --silent --show-error --output /dev/null --write-out '%{content_type}' https://kuranai.talhacan.com/.well-known/assetlinks.json)" == application/json* ]]
