<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2560" height="1440" viewBox="0 0 2560 1440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06120e"/>
      <stop offset="1" stop-color="#162315"/>
    </linearGradient>
    <radialGradient id="glow" cx="76%" cy="46%" r="48%">
      <stop offset="0" stop-color="#e1b52d" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#e1b52d" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="screenClip">
      <rect x="1680" y="82" width="574" height="1276" rx="54"/>
