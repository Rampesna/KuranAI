      <text x="312" y="58" fill="#07130f" text-anchor="middle" font-family="SF Pro Text, Helvetica, sans-serif" font-size="34" font-weight="700">Türkçe • English • العربية</text>
    </g>
    <text x="0" y="742" fill="#7f8d86" font-family="SF Pro Text, Helvetica, sans-serif" font-size="28">Eğitim amaçlıdır; fetva niteliği taşımaz.</text>
  </g>
  <rect x="1648" y="50" width="638" height="1340" rx="78" fill="#020806" stroke="#e7bd32" stroke-opacity="0.5" stroke-width="4" filter="url(#shadow)"/>
  <image x="1680" y="82" width="574" height="1276" preserveAspectRatio="none"
