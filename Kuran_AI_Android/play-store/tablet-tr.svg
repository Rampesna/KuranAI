  <path d="M0 1210 C520 1030 920 1390 1460 1160 C1880 980 2160 1080 2560 930 L2560 1440 L0 1440Z" fill="#e1b52d" opacity="0.07"/>
  <g transform="translate(180 290)">
    <text x="0" y="72" fill="#e7bd32" font-family="SF Pro Display, Helvetica, sans-serif" font-size="46" font-weight="700" letter-spacing="5">KURAN AI</text>
    <text x="0" y="190" fill="#fff8e8" font-family="SF Pro Display, Helvetica, sans-serif" font-size="92" font-weight="750">Kur’an’ı keşfet.</text>
    <text x="0" y="285" fill="#fff8e8" font-family="SF Pro Display, Helvetica, sans-serif" font-size="92" font-weight="750">Sorunu sor.</text>
    <text x="0" y="390" fill="#cbd3ce" font-family="SF Pro Text, Helvetica, sans-serif" font-size="40">Tefsir, hadis, ayet açıklamaları</text>
    <text x="0" y="448" fill="#cbd3ce" font-family="SF Pro Text, Helvetica, sans-serif" font-size="40">ve namaz vakitleri tek uygulamada.</text>
    <g transform="translate(0 548)">
