      <stop offset="0" stop-color="#06120e"/>
      <stop offset="1" stop-color="#162315"/>
    </linearGradient>
    <radialGradient id="glow" cx="25%" cy="46%" r="48%">
      <stop offset="0" stop-color="#e1b52d" stop-opacity="0.24"/>
